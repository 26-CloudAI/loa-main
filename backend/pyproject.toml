[project]
name = "ai-arena"
version = "1.0.0"
description = "AI 봇 배틀로얄 실시간 관전 플랫폼"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.4",
    "google-genai>=1.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.104", "uvicorn[standard]>=0.24", "redis>=5.0", "psycopg2-binary>=2.9"]
sandbox = ["docker>=7.0"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.21", "cachetools>=5.0", "httpx>=0.25"]

[tool.pytest.ini_options]
testpaths = ["battle_royale/tests"]
# backend/: core/ 패키지 검색용
# battle_royale/: src/, bots/ 검색용
pythonpath = [".", "battle_royale"]
