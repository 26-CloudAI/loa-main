<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>MockStocks Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0d1117;color:#e6edf3;font-family:'Segoe UI',sans-serif;font-size:13px}
  header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:#161b22;border-bottom:1px solid #30363d}
  header h1{font-size:16px;font-weight:700;color:#58a6ff}
  #tick-display{color:#8b949e;font-size:13px}
  #tick-display span{color:#e6edf3;font-weight:600}
  button{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
  #btn-start{background:#238636;color:#fff}
  #btn-start:hover{background:#2ea043}
  #btn-start:disabled{background:#21262d;color:#8b949e;cursor:not-allowed}
  #status-badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
  .badge-waiting{background:#21262d;color:#8b949e}
  .badge-running{background:#0d4429;color:#3fb950}
  .badge-finished{background:#161b22;color:#8b949e}

  main{display:grid;grid-template-columns:1fr 320px;grid-template-rows:auto auto;gap:1px;background:#30363d;height:calc(100vh - 45px)}

  section{background:#0d1117;padding:14px}
  .section-title{font-size:11px;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}

  /* 주가 패널 */
  #panel-chart{grid-row:1;grid-column:1;display:flex;flex-direction:column}
  #stock-tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
  .stock-tab{padding:3px 8px;border-radius:4px;border:1px solid #30363d;background:#161b22;color:#8b949e;cursor:pointer;font-size:11px;transition:.15s}
  .stock-tab.active{border-color:#58a6ff;color:#58a6ff;background:#0d2d6b}
  .stock-tab.up{border-color:#3fb950;color:#3fb950}
  .stock-tab.down{border-color:#f85149;color:#f85149}
  #chart-wrap{flex:1;position:relative;min-height:220px}

  /* 리더보드 + 뉴스 패널 */
  #panel-right{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;gap:1px;overflow:hidden}
  #panel-leader{flex:1;overflow-y:auto;background:#0d1117;padding:14px}
  #panel-news{height:200px;overflow-y:auto;background:#0d1117;padding:14px}

  /* 리더보드 */
  .leader-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #21262d}
  .leader-rank{width:20px;text-align:right;color:#8b949e;font-weight:700}
  .leader-bar-wrap{flex:1;height:6px;background:#21262d;border-radius:3px;overflow:hidden}
  .leader-bar{height:100%;border-radius:3px;transition:width .3s}
  .leader-info{width:120px;text-align:right}
  .leader-name{font-size:11px;color:#e6edf3;font-weight:600}
  .leader-val{font-size:11px;color:#8b949e}

  /* 포트폴리오 패널 */
  #panel-portfolio{grid-row:2;grid-column:1;overflow-y:auto}
  #bot-select-wrap{margin-bottom:10px;display:flex;gap:8px;align-items:center}
  #bot-select{background:#161b22;border:1px solid #30363d;color:#e6edf3;padding:4px 8px;border-radius:6px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{color:#8b949e;text-align:left;padding:4px 8px;border-bottom:1px solid #21262d;font-weight:600}
  td{padding:5px 8px;border-bottom:1px solid #161b22}
  .pos{color:#3fb950}.neg{color:#f85149}.neu{color:#8b949e}

  /* 뉴스 */
  .news-item{padding:6px 0;border-bottom:1px solid #21262d;font-size:11px;line-height:1.5}
  .news-sym{font-weight:700;color:#58a6ff;margin-right:4px}
  .news-time{color:#8b949e;font-size:10px}
  #news-empty{color:#8b949e;font-size:11px}

  ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#0d1117}::-webkit-scrollbar-thumb{background:#30363d;border-radius:2px}
</style>
</head>
<body>

<header>
  <h1>📈 MockStocks</h1>
  <div id="tick-display">Tick <span id="cur-tick">0</span> / <span id="max-tick">200</span></div>
  <span id="status-badge" class="badge-waiting">대기</span>
  <div style="flex:1"></div>
  <label style="color:#8b949e;font-size:12px;margin-right:4px">봇 수
    <input id="inp-bots" type="number" min="2" max="10" value="4"
      style="width:48px;background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:4px;padding:2px 6px;margin-left:4px">
  </label>
  <label style="color:#8b949e;font-size:12px;margin-right:8px">속도
    <input id="inp-speed" type="number" min="0.02" max="2" step="0.05" value="0.1"
      style="width:52px;background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:4px;padding:2px 6px;margin-left:4px">s
  </label>
  <button id="btn-start" onclick="startGame()">게임 시작</button>
</header>

<main>
  <!-- 주가 차트 -->
  <section id="panel-chart">
    <div class="section-title">주가 차트</div>
    <div id="stock-tabs"></div>
    <div id="chart-wrap"><canvas id="price-chart"></canvas></div>
  </section>

  <!-- 우측: 리더보드 + 뉴스 -->
  <div id="panel-right">
    <section id="panel-leader">
      <div class="section-title">리더보드</div>
      <div id="leaderboard-list"></div>
    </section>
    <section id="panel-news">
      <div class="section-title">뉴스 피드</div>
      <div id="news-list"><div id="news-empty" style="color:#8b949e">뉴스 없음</div></div>
    </section>
  </div>

  <!-- 포트폴리오 -->
  <section id="panel-portfolio">
    <div class="section-title" style="display:flex;align-items:center;gap:8px">
      포트폴리오
      <div id="bot-select-wrap">
        <select id="bot-select" onchange="renderPortfolio()"><option value="">봇 선택</option></select>
      </div>
    </div>
    <div id="portfolio-table"></div>
  </section>
</main>

<script>
const API = 'http://localhost:8090'
let ws = null, chart = null
let priceHistory = {}   // symbol → [prices...]
let activeSym = null
let lastSnap = null
let botIds = []
const COLORS = ['#58a6ff','#3fb950','#d29922','#f85149','#a371f7','#79c0ff','#56d364','#ffa657','#ff7b72','#e3b341','#bc8cff','#39d353','#f2a65a','#4cc2fb','#c4a9ff']
const MAX_HIST = 200

// ── 게임 시작 ────────────────────────────────────────────────────────────────
async function startGame() {
  const btn = document.getElementById('btn-start')
  btn.disabled = true
  if (ws) { ws.close(); ws = null }

  const minBots = parseInt(document.getElementById('inp-bots').value) || 4
  const speed   = parseFloat(document.getElementById('inp-speed').value) || 0.1

  setStatus('waiting')
  priceHistory = {}; activeSym = null; lastSnap = null; botIds = []
  document.getElementById('leaderboard-list').innerHTML = ''
  document.getElementById('news-list').innerHTML = '<div id="news-empty" style="color:#8b949e">뉴스 없음</div>'
  document.getElementById('bot-select').innerHTML = '<option value="">봇 선택</option>'
  document.getElementById('portfolio-table').innerHTML = ''

  let gameId
  try {
    const res = await fetch(`${API}/api/games`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ bots: [], fill_with_ai: true, min_bots: minBots, tick_interval: speed })
    })
    if (!res.ok) throw new Error(await res.text())
    const data = await res.json()
    gameId = data.game_id
    botIds = data.bot_ids || []
    document.getElementById('max-tick').textContent = 200
    populateBotSelect(botIds)
  } catch(e) {
    alert('게임 생성 실패: ' + e.message)
    btn.disabled = false
    return
  }

  ws = new WebSocket(`ws://localhost:8090/ws/games/${gameId}`)
  ws.onmessage = e => handleMessage(JSON.parse(e.data))
  ws.onopen    = () => setStatus('running')
  ws.onclose   = () => { if (lastSnap && !lastSnap.finished) setStatus('waiting'); btn.disabled = false }
  ws.onerror   = () => { alert('WebSocket 오류'); btn.disabled = false }
}

function handleMessage(msg) {
  if (msg.type === 'game_start') return
  if (msg.type === 'game_end') { setStatus('finished'); return }
  if (msg.type !== 'tick') return

  const data = msg.data
  lastSnap = data
  document.getElementById('cur-tick').textContent = data.tick

  // 가격 히스토리 축적
  if (data.market && data.market.stocks) {
    data.market.stocks.forEach(s => {
      if (!priceHistory[s.symbol]) priceHistory[s.symbol] = []
      priceHistory[s.symbol].push(s.price)
      if (priceHistory[s.symbol].length > MAX_HIST) priceHistory[s.symbol].shift()
    })
    renderTabs(data.market.stocks)
    renderChart()
  }

  if (data.leaderboard) renderLeaderboard(data.leaderboard)
  if (data.market && data.market.news) renderNews(data.market.news, data.tick)
  renderPortfolio()
}

// ── 종목 탭 ──────────────────────────────────────────────────────────────────
function renderTabs(stocks) {
  const wrap = document.getElementById('stock-tabs')
  if (!activeSym && stocks.length) activeSym = stocks[0].symbol

  const existing = new Set([...wrap.querySelectorAll('.stock-tab')].map(el => el.dataset.sym))
  stocks.forEach((s, i) => {
    let el = wrap.querySelector(`[data-sym="${s.symbol}"]`)
    if (!el) {
      el = document.createElement('button')
      el.className = 'stock-tab'
      el.dataset.sym = s.symbol
      el.onclick = () => { activeSym = s.symbol; renderChart(); renderTabs(stocks) }
      wrap.appendChild(el)
    }
    el.textContent = `${s.symbol} ${s.change_pct >= 0 ? '+' : ''}${s.change_pct.toFixed(1)}%`
    el.className = 'stock-tab' + (s.symbol === activeSym ? ' active' : (s.change_pct >= 0 ? ' up' : ' down'))
    if (s.delisted) { el.textContent = `${s.symbol} 상폐`; el.style.opacity = '.4' }
  })
}

// ── 차트 ─────────────────────────────────────────────────────────────────────
function renderChart() {
  if (!activeSym || !priceHistory[activeSym]) return
  const hist = priceHistory[activeSym]
  const labels = hist.map((_, i) => i + 1)

  if (!chart) {
    const ctx = document.getElementById('price-chart').getContext('2d')
    chart = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets: [{
        label: activeSym,
        data: hist,
        borderColor: '#58a6ff',
        backgroundColor: 'rgba(88,166,255,.08)',
        borderWidth: 1.5,
        pointRadius: 0,
        tension: 0.3,
        fill: true,
      }]},
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: false,
        plugins: { legend: { display: false }, tooltip: {
          callbacks: { label: ctx => `₩${ctx.raw.toLocaleString()}` }
        }},
        scales: {
          x: { display: false },
          y: { grid: { color: '#21262d' }, ticks: { color: '#8b949e',
            callback: v => '₩' + (v >= 1000 ? (v/1000).toFixed(0)+'K' : v)
          }}
        }
      }
    })
  } else {
    chart.data.labels = labels
    chart.data.datasets[0].label = activeSym
    chart.data.datasets[0].data  = hist
    chart.update('none')
  }
}

// ── 리더보드 ─────────────────────────────────────────────────────────────────
function renderLeaderboard(board) {
  const wrap = document.getElementById('leaderboard-list')
  const top  = board[0] ? board[0].total_value : 1
  const base = 100_000_000

  wrap.innerHTML = board.map((e, i) => {
    const pct  = Math.max(2, (e.total_value / top * 100)).toFixed(1)
    const diff = e.total_value - base
    const diffStr = (diff >= 0 ? '+' : '') + (diff / 10000).toFixed(0) + '만'
    const cls  = diff >= 0 ? 'pos' : 'neg'
    const color = COLORS[i % COLORS.length]
    return `<div class="leader-row">
      <div class="leader-rank">${e.rank}</div>
      <div style="flex:1">
        <div class="leader-name">${e.id}</div>
        <div class="leader-bar-wrap"><div class="leader-bar" style="width:${pct}%;background:${color}"></div></div>
      </div>
      <div class="leader-info">
        <div class="leader-name ${cls}">${diffStr}</div>
        <div class="leader-val">₩${(e.total_value/10000).toFixed(0)}만</div>
      </div>
    </div>`
  }).join('')
}

// ── 뉴스 ─────────────────────────────────────────────────────────────────────
const _seenNews = new Set()
function renderNews(news, tick) {
  if (!news.length) return
  const wrap = document.getElementById('news-list')
  const empty = document.getElementById('news-empty')
  if (empty) empty.remove()

  news.forEach(n => {
    const key = n.symbol + n.headline
    if (_seenNews.has(key)) return
    _seenNews.add(key)
    const el = document.createElement('div')
    el.className = 'news-item'
    el.innerHTML = `<span class="news-sym">${n.symbol}</span>${n.headline} <span class="news-time">T${tick} (${n.ticks_remaining}턴)</span>`
    wrap.prepend(el)
  })
}

// ── 포트폴리오 ───────────────────────────────────────────────────────────────
function populateBotSelect(ids) {
  const sel = document.getElementById('bot-select')
  sel.innerHTML = '<option value="">봇 선택</option>'
  ids.forEach(id => {
    const opt = document.createElement('option')
    opt.value = id; opt.textContent = id
    sel.appendChild(opt)
  })
  if (ids.length) { sel.value = ids[0]; renderPortfolio() }
}

function renderPortfolio() {
  const sel  = document.getElementById('bot-select').value
  const wrap = document.getElementById('portfolio-table')
  if (!sel || !lastSnap) { wrap.innerHTML = '<div style="color:#8b949e;padding:8px">봇을 선택하세요</div>'; return }

  const bot = lastSnap.bots && lastSnap.bots[sel]
  if (!bot) return

  const priceMap = {}
  if (lastSnap.market) lastSnap.market.stocks.forEach(s => priceMap[s.symbol] = s.price)

  let rows = ''
  const portfolio = bot.portfolio || {}
  Object.entries(portfolio).forEach(([sym, pos]) => {
    const cur    = priceMap[sym] || 0
    const pnl    = (cur - pos.avg_cost) * pos.quantity
    const pnlPct = pos.avg_cost ? ((cur - pos.avg_cost) / pos.avg_cost * 100).toFixed(1) : '0.0'
    const cls    = pnl >= 0 ? 'pos' : 'neg'
    rows += `<tr>
      <td>${sym}</td>
      <td style="text-align:right">${pos.quantity.toLocaleString()}</td>
      <td style="text-align:right">₩${(pos.avg_cost/1000).toFixed(1)}K</td>
      <td style="text-align:right">₩${(cur/1000).toFixed(1)}K</td>
      <td style="text-align:right" class="${cls}">${pnl >= 0 ? '+' : ''}${(pnl/10000).toFixed(0)}만 (${pnlPct}%)</td>
    </tr>`
  })

  const shorts = bot.short_positions || {}
  Object.entries(shorts).forEach(([sym, pos]) => {
    const cur    = priceMap[sym] || 0
    const pnl    = (pos.avg_sell_price - cur) * pos.quantity
    const cls    = pnl >= 0 ? 'pos' : 'neg'
    rows += `<tr>
      <td>📉 ${sym}</td>
      <td style="text-align:right">${pos.quantity.toLocaleString()}</td>
      <td style="text-align:right">₩${(pos.avg_sell_price/1000).toFixed(1)}K</td>
      <td style="text-align:right">₩${(cur/1000).toFixed(1)}K</td>
      <td style="text-align:right" class="${cls}">${pnl >= 0 ? '+' : ''}${(pnl/10000).toFixed(0)}만</td>
    </tr>`
  })

  const cash = bot.cash || 0
  const total = bot.total_value || 0
  const credit = bot.credit_score || 0

  wrap.innerHTML = `
    <div style="display:flex;gap:20px;margin-bottom:8px;font-size:12px">
      <div>현금 <span style="color:#e6edf3;font-weight:600">₩${(cash/10000).toFixed(0)}만</span></div>
      <div>총자산 <span style="color:#58a6ff;font-weight:600">₩${(total/10000).toFixed(0)}만</span></div>
      <div>신용 <span style="color:#d29922;font-weight:600">${credit}점</span></div>
    </div>
    ${rows ? `<table>
      <thead><tr><th>종목</th><th style="text-align:right">수량</th><th style="text-align:right">평단가</th><th style="text-align:right">현재가</th><th style="text-align:right">평가손익</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>` : '<div style="color:#8b949e;padding:8px">보유 종목 없음</div>'}
  `
}

// ── 상태 뱃지 ────────────────────────────────────────────────────────────────
function setStatus(s) {
  const el = document.getElementById('status-badge')
  el.className = 'badge-' + s
  el.textContent = {waiting:'대기', running:'진행 중', finished:'종료'}[s] || s
}
</script>
</body>
</html>
