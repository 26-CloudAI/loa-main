apiVersion: v1
kind: Namespace
metadata:
  name: arena
  labels:
    pod-security.kubernetes.io/enforce: baseline      # game-server가 root로 실행되므로 restricted 미충족
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted       # restricted 위반 항목 경고 (비차단)
    pod-security.kubernetes.io/warn-version: latest
