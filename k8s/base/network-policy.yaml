apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bot-runner-isolation
  namespace: arena
spec:
  podSelector:
    matchLabels:
      app: bot-runner
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: game-server
      ports:
        - protocol: TCP
          port: 8001
  egress: []  # 외부 네트워크 호출 완전 차단 (봇 코드 데이터 유출 방지)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: game-server-isolation
  namespace: arena
spec:
  podSelector:
    matchLabels:
      app: game-server
  policyTypes:
    - Ingress
  ingress:
    # GKE 외부 HTTP(S) LB(GFE) + 헬스체커는 Pod이 아니라 Google LB IP 대역에서 옴.
    # NEG(container-native LB)는 이 대역에서 Pod IP로 직접 트래픽/헬스체크 전송.
    # namespaceSelector로는 이 대역을 못 잡으므로 ipBlock 사용. (그 외 클러스터 내 Pod 횡방향 접근은 차단)
    - from:
        - ipBlock:
            cidr: 130.211.0.0/22
        - ipBlock:
            cidr: 35.191.0.0/16
      ports:
        - protocol: TCP
          port: 8080
