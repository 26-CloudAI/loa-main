apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-server
  namespace: arena
spec:
  replicas: 1  # 세션이 프로세스 메모리에 있음. Redis 외부화 전까지 1 고정
  selector:
    matchLabels:
      app: game-server
  template:
    metadata:
      labels:
        app: game-server
    spec:
      serviceAccountName: game-server
      containers:
        - name: game-server
          image: asia-northeast3-docker.pkg.dev/knu-2026-sungjin0418/ai-arena/server:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: arena-config
            - secretRef:
                name: arena-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
