apiVersion: v1
kind: ConfigMap
metadata:
  name: arena-config
  namespace: arena
data:
  USE_REDIS: "true"
  REDIS_HOST: "10.197.54.43"
  LOG_FORMAT: "json"
  CORS_ORIGINS: "https://leagueofagents.net,https://www.leagueofagents.net,https://ai-arena-b2b4b.web.app,https://ai-arena-b2b4b.firebaseapp.com,https://ai-arena-b2b4b--gke-demo-9gp3ldb7.web.app"
  DB_TYPE: "postgresql"
  DB_HOST: "10.114.0.3"
  DB_NAME: "ai_arena"
  DB_USER: "arena_user"
  ENV: "production"
  BOT_RUNNER_URL: "http://bot-runner.arena.svc.cluster.local:8001"
  BOT_RUNNER_REQUIRED: "true"
  BOT_RUNNER_TIMEOUT_SEC: "2.0"  # game-server → bot-runner HTTP 호출 타임아웃. 봇 실행(BOT_ACTION_TIMEOUT_SEC 0.1) + cold-compile/gVisor/네트워크 오버헤드까지 덮어야 함. 0.5s는 cold-start에서 타임아웃→ZERO 폴백 유발(BR2 매치 미종료 원인). 호출은 비차단(asyncio.to_thread)이라 상향해도 이벤트루프 안 막음.
  # BOSS_WEIGHTS_GCS_URI 는 여기에 쓰지 않는다.
  # Phase 5 Cloud Build step에서 kubectl patch로 주입한다. (버킷명 git 노출 방지)
