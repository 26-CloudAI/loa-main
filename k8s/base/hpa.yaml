apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bot-runner-hpa
  namespace: arena
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bot-runner
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
# game-server는 HPA 없음 — replicas: 1 고정 (세션 메모리 보존 필요)
# bot-runner는 stateless /run 방식이라 HPA 안전하게 적용 가능
