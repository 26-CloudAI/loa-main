substitutions:
  _REGION: asia-northeast3
  _REPOSITORY: ai-arena
  _SERVICE_NAME: ai-arena-server
  _IMAGE_TAG: latest       # 트리거 실행 시 ${_IMAGE_TAG}로 덮어씀, 수동 실행 시 latest 사용
  # ↓ 인프라 생성 후 Cloud Build 트리거 설정에서 채워넣기
  _REDIS_HOST: '10.197.54.43'
  _CORS_ORIGINS: 'https://ai-arena-b2b4b.web.app,https://ai-arena-b2b4b.firebaseapp.com'

steps:
  # 1. Docker 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/server:${_IMAGE_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/server:latest'
      - 'backend'

  # 2. Artifact Registry에 이미지 푸시 (커밋 SHA + latest 태그 동시)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/server'

  # 3. Cloud Run 배포
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/server:${_IMAGE_TAG}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

      # 리소스
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--port'
      - '8080'

      # VPC (Memorystore Redis 접근용)
      - '--vpc-connector'
      - 'arena-connector'

      # Cloud SQL (PostgreSQL)
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:${_REGION}:arena-db'

      # Secret Manager (Firebase 서비스 계정 + DB 비밀번호)
      - '--set-secrets'
      - 'FIREBASE_CREDENTIALS_JSON=firebase-service-account:latest,DB_PASSWORD=db-password:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest'

      # 환경변수 (CORS_ORIGINS 값에 콤마가 포함되므로 | 를 구분자로 사용)
      - '--set-env-vars'
      - >-
        ^|^USE_REDIS=true|REDIS_HOST=${_REDIS_HOST}|LOG_FORMAT=json|CORS_ORIGINS=${_CORS_ORIGINS}|DB_TYPE=postgresql|DB_HOST=10.114.0.3|DB_NAME=ai_arena|DB_USER=arena_user|ENV=production

      - '--quiet'

options:
  logging: CLOUD_LOGGING_ONLY
