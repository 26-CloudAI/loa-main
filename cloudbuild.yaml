substitutions:
  _REGION: asia-northeast3
  _REPOSITORY: ai-arena
  _SERVICE_NAME: ai-arena-server
  _IMAGE_TAG: latest       # 트리거 실행 시 ${_IMAGE_TAG}로 덮어씀, 수동 실행 시 latest 사용
  # ↓ 인프라 생성 후 Cloud Build 트리거 설정에서 채워넣기
  _REDIS_HOST: '10.197.54.43'
  _CORS_ORIGINS: 'https://leagueofagents.net,https://www.leagueofagents.net,https://ai-arena-b2b4b.web.app,https://ai-arena-b2b4b.firebaseapp.com'
  # GCS 버킷: Cloud Build 트리거 설정의 substitution 변수에서 직접 입력
  # (버킷명 노출 방지 — 여기에 실제 URI를 적지 말 것)
  _BOSS_WEIGHTS_GCS_URI: 'gs://boss-weights/trained_weights.json'
  # BR2 헤드리스 러너(C2) WS 인증 공유 시크릿 — 빈 값이면 러너 비인증 실패.
  # repo 에 시크릿 커밋 금지 → Cloud Build 트리거 substitution 에서 실제 값 주입.
  _BR2_RUNNER_SECRET: ''

steps:
  # 1a. 서버 Docker 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/server:${_IMAGE_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/server:latest'
      - 'backend'

  # 1b. 학습 워커(trainer) Docker 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'backend/Dockerfile.trainer'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/trainer:${_IMAGE_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/trainer:latest'
      - 'backend'

  # 2. Artifact Registry에 이미지 푸시 (서버 + trainer)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/server'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/trainer'

  # 3. Cloud Run 서비스 배포
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/server:${_IMAGE_TAG}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

      # 리소스 (C2 헤드리스 러너 동작 위해 상향)
      # Redis 기반(USE_REDIS=true) 관전 릴레이/StateStore/권위 선출로 멀티 인스턴스 지원.
      # 멀티 인스턴스 e2e(BattleRoyale2/tests/e2e_multi_instance.py) 통과 → max-instances 상향.
      # min=1(상시 warm) ~ max=3 오토스케일. 동시 러너 최대 = max × BR2_MAX_CONCURRENT_GAMES.
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '2'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '3'
      - '--timeout'
      - '3600'   # WS 매치(~3분) 동안 연결 유지
      - '--port'
      - '8080'

      # VPC (Memorystore Redis 접근용)
      - '--vpc-connector'
      - 'arena-connector'

      # Cloud SQL (PostgreSQL)
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:${_REGION}:arena-db'

      # Secret Manager (Firebase 서비스 계정 + DB 비밀번호)
      - '--set-secrets'
      - 'FIREBASE_CREDENTIALS_JSON=firebase-service-account:latest,DB_PASSWORD=db-password:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest'

      # 환경변수 (CORS_ORIGINS 값에 콤마가 포함되므로 | 를 구분자로 사용)
      - '--set-env-vars'
      - >-
        ^|^USE_REDIS=true|REDIS_HOST=${_REDIS_HOST}|LOG_FORMAT=json|CORS_ORIGINS=${_CORS_ORIGINS}|DB_TYPE=postgresql|DB_HOST=10.114.0.3|DB_NAME=ai_arena|DB_USER=arena_user|ENV=production|BOSS_WEIGHTS_GCS_URI=${_BOSS_WEIGHTS_GCS_URI}|BR2_RUNNER_ENABLED=1|BR2_GODOT_BIN=/usr/local/bin/godot_server|BR2_GAME_PCK=/app/BattleRoyale2/runner/game.pck|BR2_RUNNER_WS=ws://127.0.0.1:8080/battleroyale2/match/|BR2_RUNNER_SECRET=${_BR2_RUNNER_SECRET}|BR2_MAX_CONCURRENT_GAMES=4|BR2_MATCH_TIMEOUT_SEC=240

      - '--quiet'

  # 4. Cloud Run Job 배포 (학습 워커)
  #    Job은 Cloud Scheduler가 트리거. 여기서는 Job 정의만 갱신함.
  #    최초 1회: gcloud scheduler jobs create 명령 별도 실행 필요 (아래 주석 참고)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'boss-trainer'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/trainer:${_IMAGE_TAG}'
      - '--region'
      - '${_REGION}'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--task-timeout'
      - '10800'   # 3시간
      - '--max-retries'
      - '1'
      - '--set-env-vars'
      - 'BOSS_WEIGHTS_GCS_URI=${_BOSS_WEIGHTS_GCS_URI}'
      - '--quiet'

# ---------------------------------------------------------------------------
# 인프라 최초 설정 (1회만 실행, Cloud Build 파이프라인 밖에서 gcloud CLI로)
# ---------------------------------------------------------------------------
# 1. GCS 버킷 생성
#    gsutil mb -l asia-northeast3 gs://${PROJECT_ID}-boss-weights
#
# 2. Cloud Run Job 서비스 계정에 GCS 권한 부여
#    gcloud projects add-iam-policy-binding ${PROJECT_ID} \
#      --member="serviceAccount:$(gcloud run jobs describe boss-trainer --region=asia-northeast3 --format='value(spec.template.spec.serviceAccountName)')" \
#      --role="roles/storage.objectAdmin"
#
# 3. Cloud Run 서비스 계정에 GCS 읽기 권한 부여
#    gcloud projects add-iam-policy-binding ${PROJECT_ID} \
#      --member="serviceAccount:$(gcloud run services describe ai-arena-server --region=asia-northeast3 --format='value(spec.template.spec.serviceAccountName)')" \
#      --role="roles/storage.objectViewer"
#
# 4. 초기 가중치 업로드 (로컬 trained_weights.json → GCS)
#    gsutil cp backend/battle_royale/bots/trained_weights.json \
#      gs://${PROJECT_ID}-boss-weights/trained_weights.json
#
# 5. Cloud Scheduler 등록 (매일 새벽 3시 asia-northeast3)
#    gcloud scheduler jobs create http boss-trainer-daily \
#      --schedule="0 3 * * *" \
#      --uri="https://${_REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${PROJECT_ID}/jobs/boss-trainer:run" \
#      --http-method=POST \
#      --oauth-service-account-email="$(gcloud iam service-accounts list --filter='displayName:Compute Engine' --format='value(email)')" \
#      --location=asia-northeast3

options:
  logging: CLOUD_LOGGING_ONLY
